codecov:
  require_ci_to_pass: true
  max_report_age: off

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: true

component_management:
  default_rules:
    statuses:
      - type: patch
        target: auto
  individual_components:
    - component_id: registry-doc
      name: "registry-doc"
      paths:
        - packages/registry-doc/**
