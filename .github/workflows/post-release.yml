# Scaffolded — edit this file freely.
name: Post-release Sync

on: # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions:
  contents: read

jobs:
  broadcast:
    name: Broadcast readme sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger broadcast readme sync
        run: |
          gh workflow run sync-broadcast.yml \
            --repo theholocron/.github \
            --field "steps=readme"
        env:
          GH_TOKEN: ${{ secrets.HOLOCRON_SYNC_TOKEN }}
